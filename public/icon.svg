<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="turquoiseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="gemShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0.8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#turquoiseGradient)" />

  <!-- Subtle corner ambient highlight -->
  <circle cx="120" cy="90" r="180" fill="#ffffff" opacity="0.12" />

  <g filter="url(#softGlow)" transform="translate(256, 260) scale(1.15)">
    <!-- Shopping bag / boutique handle -->
    <path d="M -60 -75 C -60 -150, 60 -150, 60 -75" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Main Turquoise Faceted Gemstone Motif -->
    <!-- Table facet (Center Top) -->
    <polygon points="-65,-70 65,-70 95,-25 0,45 -95,-25" fill="url(#gemShine)" stroke="#ffffff" stroke-width="3" />
    
    <!-- Top-left facet -->
    <polygon points="-65,-70 -95,-25 -155,-25 -105,-70" fill="#99f6e4" stroke="#ffffff" stroke-width="3" />
    
    <!-- Top-right facet -->
    <polygon points="65,-70 105,-70 155,-25 95,-25" fill="#5eead4" stroke="#ffffff" stroke-width="3" />
    
    <!-- Bottom-left facet -->
    <polygon points="-95,-25 0,45 0,150 -155,-25" fill="#2dd4bf" stroke="#ffffff" stroke-width="3" />
    
    <!-- Bottom-right facet -->
    <polygon points="95,-25 155,-25 0,150 0,45" fill="#14b8a6" stroke="#ffffff" stroke-width="3" />
    
    <!-- Central spark reflections -->
    <circle cx="0" cy="-10" r="8" fill="#ffffff" opacity="0.9" />
    <polygon points="0,-35 4,-18 20,-18 7,-7 12,10 0,0 -12,10 -7,-7 -20,-18 -4,-18" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
